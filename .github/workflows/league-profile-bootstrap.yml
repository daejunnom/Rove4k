  control-ubuntu22:
    # Download the actual control producer output from this exact run; a
    # successful compiler fixture is not engine, TT, NUMA or game admission.
    needs: generate
    if: always() && needs.generate.result != 'cancelled' && needs.generate.result != 'skipped'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        family: [A, C, E, F]
        profile: [test-p16, test-p192]
    env:
      FAMILY: ${{ matrix.family }}
      PROFILE: ${{ matrix.profile }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: league-source-${{ matrix.family }}-${{ matrix.profile }}-control-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control-league-source-${{ matrix.family }}-${{ matrix.profile }}
      - name: Prepare independent system Python and the pinned rules oracle
        shell: bash
        run: |
          export PATH=/usr/bin:/bin
          for compiler_env_name in ${!LD_@}; do unset "$compiler_env_name"; done
          unset CC CXX CPP AS AR LD GCC_EXEC_PREFIX COMPILER_PATH LIBRARY_PATH CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH OBJC_INCLUDE_PATH CFLAGS CPPFLAGS CXXFLAGS LDFLAGS
          /usr/bin/python3 -m venv "$RUNNER_TEMP/league-python-$FAMILY-$PROFILE"
          "$RUNNER_TEMP/league-python-$FAMILY-$PROFILE/bin/python3" -m pip install --require-hashes -r engines/training/e19/requirements.txt
      - name: Verify the named completed control artifact
        shell: bash
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / ('control-league-source-' + os.environ['FAMILY'] + '-' + os.environ['PROFILE'])
          manifest = json.loads((root / 'build/build.json').read_text())
          audit = json.loads((root / 'artifact-audit.json').read_text())
          whole = (root / 'build/x').read_bytes()
          identity = (os.environ['FAMILY'], os.environ['PROFILE'])
          if (manifest.get('family'), manifest.get('resources', {}).get('id')) != identity:
              raise ValueError('producer family or resource profile differs from matrix')
          if manifest.get('complete') is not True or manifest.get('reproducible') is not True:
              raise ValueError('partial or unreproduced producer output cannot be used')
          if any(manifest.get(name) is not None for name in ('post_profile', 'post_spelling', 'post_scan', 'post_ep', 'source_dependencies')):
              raise ValueError('expected the unmodified control recipe')
          if (audit.get('family'), audit.get('profile'), audit.get('variant')) != (*identity, 'control'):
              raise ValueError('artifact audit identity or selected variant differs')
          actual = {'bytes': len(whole), 'sha256': hashlib.sha256(whole).hexdigest()}
          if (audit.get('parts', {}).get('x') != actual
                  or audit.get('actual_whole_bytes') != len(whole)
                  or audit.get('whole_at_most_4096') is not (len(whole) <= 4096)):
              raise ValueError('artifact audit does not match actual whole file')
          if len(whole) > 4096:
              raise ValueError('control candidate exceeds the 4096-byte limit')
          print(json.dumps({'family': identity[0], 'profile': identity[1], 'whole': actual,
                            'candidate_only': True, 'runtime_qualified': False,
                            'physical_placement_qualified': False, 'playing_strength_qualified': False}, sort_keys=True))
          PY
      - name: Recompile and check the exact control source on Ubuntu 22
        shell: bash
        run: |
          set -o pipefail
          export PATH=/usr/bin:/bin
          for compiler_env_name in ${!LD_@}; do unset "$compiler_env_name"; done
          unset CC CXX CPP AS AR LD GCC_EXEC_PREFIX COMPILER_PATH LIBRARY_PATH CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH OBJC_INCLUDE_PATH CFLAGS CPPFLAGS CXXFLAGS LDFLAGS
          P="$RUNNER_TEMP/league-python-$FAMILY-$PROFILE/bin/python3"
          SOURCE="$RUNNER_TEMP/control-league-source-$FAMILY-$PROFILE/build"
          OUT="$RUNNER_TEMP/control-league-ubuntu22-$FAMILY-$PROFILE"
          mkdir "$OUT"
          "$P" -I -B engines/experiments/tcec-next/profile_compiler.py \
            --build "$SOURCE" --compiler /usr/bin/cc --ubuntu22-system --program-provenance \
            --out "$OUT/compiler" 2>&1 | tee "$OUT/compiler.log"
          "$P" -I -B engines/experiments/tcec-next/profile_rules.py \
            --family "$FAMILY" --profile "$PROFILE" --source "$SOURCE/main.c" \
            --baseline "$SOURCE/control/main.c" --proof "$SOURCE/source-proof.json" \
            --build "$SOURCE" --cc /usr/bin/cc --out "$OUT/rules" 2>&1 | tee "$OUT/rules.log"
      - name: Preserve independent compiler and rules evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: league-control-ubuntu22-${{ matrix.family }}-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control-league-ubuntu22-${{ matrix.family }}-${{ matrix.profile }}
          if-no-files-found: ignore
          retention-days: 7

  compare-b:
    needs: generate
    if: always() && needs.generate.result != 'cancelled' && needs.generate.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [test-p16, test-p192]
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download the actual control result for the same commit and attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: league-source-B-${{ matrix.profile }}-control-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b-control
      - name: Download the actual selected B result for the same commit and attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: league-source-B-${{ matrix.profile }}-tcec-final-lf-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b-tcec-final-lf
      - name: Compare actual parents, cc and ld identities and complete files
        run: |
          python -I -B - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          control, selected = root / 'b-control', root / 'b-tcec-final-lf'
          records = [json.loads((item / 'build/build.json').read_text()) for item in (control, selected)]
          audits = [json.loads((item / 'artifact-audit.json').read_text()) for item in (control, selected)]
          if any(record['family'] != 'B' or record['resources']['id'] != os.environ['PROFILE']
                 or record['complete'] is not True or record['reproducible'] is not True for record in records):
              raise ValueError('B cost input family, profile or producer completion differs')
          if [audit['b_variant'] for audit in audits] != ['control', 'tcec-final-lf']:
              raise ValueError('B control and selected artifacts are not the requested pair')
          if records[0].get('post_profile') is not None or records[1].get('post_profile') != {
                  'path': 'engines/experiments/tcec-next/profile_b.py', 'variant': 'tcec-final-lf'}:
              raise ValueError('B producer did not record the requested source stages')
          for key in ('compiler', 'compile_executor', 'compile_executor_version', 'compression'):
              if records[0][key] != records[1][key]:
                  raise ValueError('B cost compiler or compression differs: ' + key)
          for path in ('resource-projection.c', 'build/control/main.c', 'build/header.sh',
                       'compiler-sha256.txt', 'linker-sha256.txt'):
              if (control / path).read_bytes() != (selected / path).read_bytes():
                  raise ValueError('B cost parent or wrapper differs: ' + path)
          files = [(item / 'build/x').read_bytes() for item in (control, selected)]
          def actual(data):
              return {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          if any(audit['parts']['x'] != actual(data) for audit, data in zip(audits, files)):
              raise ValueError('B cost actual file does not match the producer audit')
          def load_live(name, relative):
              path = Path(relative).resolve()
              live = path.read_bytes()
              if any((item / 'build/inputs' / relative).read_bytes() != live for item in (control, selected)):
                  raise ValueError('tracked same-host packaging helper differs from a frozen producer input: ' + relative)
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              return module
          packaging = load_live('league_ci_cost_package', 'engines/scripts/source_package.py')
          wrapper = load_live('league_ci_cost_wrapper', 'engines/experiments/tcec-next/wrapper.py')
          unlink = load_live('league_ci_cost_unlink', 'engines/experiments/tcec-next/self_unlink.py')
          replay = [wrapper.package(packaging, unlink, (item / 'build/main.c').read_bytes(),
                                    records[0]['compression'], records[0]['compiler'])
                    for item in (control, selected)]
          def scope(item):
              rules = item / 'rules/probe/rules.json'
              commands = item / 'rules/commands.json'
              admission = item / 'admission.json'
              complete = False
              if rules.is_file() and commands.is_file():
                  probe = json.loads(rules.read_text())
                  receipt = json.loads(commands.read_text())
                  rows = receipt.get('commands', [])
                  expected = ['rules-compile-plain', 'rules-execute-plain',
                              'rules-compile-ubsan', 'rules-execute-ubsan']
                  complete = (probe.get('complete') is True and receipt.get('complete') is True
                      and receipt.get('host_cleanup') == {'unsettled_commands': 0, 'errors': []}
                      and [row.get('kind') for row in rows] == expected
                      and all(row.get('returncode') == 0 and row.get('terminal') is True
                          and row.get('reaped') is True and row.get('owned_group_absent') is True
                          and row.get('forced_cleanup') is False for row in rows))
              return {'rules_complete': complete,
                      'strict_source_admission': admission.is_file() and
                          json.loads(admission.read_text()).get('strict_source_admission') is True}
          report = {'profile': os.environ['PROFILE'], 'family': 'B',
                    'control': actual(files[0]), 'tcec_final_lf': actual(files[1]),
                    'selected_minus_control_bytes': len(files[1]) - len(files[0]),
                    'same_host_repackaging': {'control': actual(replay[0]), 'tcec_final_lf': actual(replay[1]),
                        'selected_minus_control_bytes': len(replay[1]) - len(replay[0]),
                        'matches_original_files': [replay[i] == files[i] for i in range(2)]},
                    'candidate_at_most_4096': len(files[1]) <= 4096,
                    'control_validation': scope(control), 'candidate_validation': scope(selected),
                    'tool_identity_scope': 'cc and ld binaries, compiler version and arguments; not the full toolchain or system image',
                    'production_selected': False, 'runtime_qualified': False,
                    'physical_placement_qualified': False, 'playing_strength_qualified': False}
          out = root / 'b-whole-comparison.json'
          out.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Preserve the B whole-file comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: league-B-whole-comparison-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b-whole-comparison.json
          if-no-files-found: error
          retention-days: 7

  league-candidates-ubuntu22:
