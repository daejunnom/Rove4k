  league-combinations-ubuntu22:
    # Compare control, every constituent, and all pair predecessors for the
    # triple on one host; separately recompile and probe each combined source.
    needs: generate
    if: always() && needs.generate.result != 'cancelled' && needs.generate.result != 'skipped'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {family: A, profile: test-p16, variant: square-atomic}
          - {family: A, profile: test-p192, variant: square-atomic}
          - {family: C, profile: test-p16, variant: square-atomic}
          - {family: C, profile: test-p192, variant: square-atomic}
          - {family: C, profile: test-p16, variant: square-ep}
          - {family: C, profile: test-p192, variant: square-ep}
          - {family: C, profile: test-p16, variant: ep-atomic}
          - {family: C, profile: test-p192, variant: ep-atomic}
          - {family: C, profile: test-p16, variant: square-ep-atomic}
          - {family: C, profile: test-p192, variant: square-ep-atomic}
          - {family: E, profile: test-p16, variant: ep-atomic}
          - {family: E, profile: test-p192, variant: ep-atomic}
    env:
      FAMILY: ${{ matrix.family }}
      PROFILE: ${{ matrix.profile }}
      VARIANT: ${{ matrix.variant }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: league-source-${{ matrix.family }}-${{ matrix.profile }}-control-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/league-parent
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: league-source-${{ matrix.family }}-${{ matrix.profile }}-${{ matrix.variant }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/league-combination
      - if: startsWith(matrix.variant, 'square-')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: league-source-${{ matrix.family }}-${{ matrix.profile }}-square-successor-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/single-square
      - if: contains(matrix.variant, 'ep')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: league-source-${{ matrix.family }}-${{ matrix.profile }}-legal-maker-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/single-ep
      - if: endsWith(matrix.variant, '-atomic')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: league-source-${{ matrix.family }}-${{ matrix.profile }}-atomic-assignment-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/single-atomic
      - if: matrix.variant == 'square-ep-atomic'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: league-source-${{ matrix.family }}-${{ matrix.profile }}-square-atomic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pair-square-atomic
      - if: matrix.variant == 'square-ep-atomic'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: league-source-${{ matrix.family }}-${{ matrix.profile }}-square-ep-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pair-square-ep
      - if: matrix.variant == 'square-ep-atomic'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: league-source-${{ matrix.family }}-${{ matrix.profile }}-ep-atomic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pair-ep-atomic
      - name: Prepare independent system Python and pinned rules oracle
        run: |
          export PATH=/usr/bin:/bin
          for compiler_env_name in ${!LD_@}; do unset "$compiler_env_name"; done
          unset CC CXX CPP AS AR LD GCC_EXEC_PREFIX COMPILER_PATH LIBRARY_PATH CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH OBJC_INCLUDE_PATH CFLAGS CPPFLAGS CXXFLAGS LDFLAGS
          /usr/bin/python3 -m venv "$RUNNER_TEMP/league-combination-python"
          "$RUNNER_TEMP/league-combination-python/bin/python3" -m pip install --require-hashes -r engines/training/e19/requirements.txt
      - name: Compare same-run control, constituents and full files
        run: |
          set -o pipefail
          singles=()
          case "$VARIANT" in square-*) singles+=(--single square-successor "$RUNNER_TEMP/single-square");; esac
          case "$VARIANT" in *ep*) singles+=(--single legal-maker "$RUNNER_TEMP/single-ep");; esac
          case "$VARIANT" in *-atomic) singles+=(--single atomic-assignment "$RUNNER_TEMP/single-atomic");; esac
          if [ "$VARIANT" = square-ep-atomic ]; then
            singles+=(--pair square-atomic "$RUNNER_TEMP/pair-square-atomic"
                      --pair square-ep "$RUNNER_TEMP/pair-square-ep"
                      --pair ep-atomic "$RUNNER_TEMP/pair-ep-atomic")
          fi
          /usr/bin/python3 -I -B engines/experiments/tcec-next/league_compound_compare.py \
            --family "$FAMILY" --profile "$PROFILE" --variant "$VARIANT" \
            --control "$RUNNER_TEMP/league-parent" --candidate "$RUNNER_TEMP/league-combination" \
            "${singles[@]}" --out "$RUNNER_TEMP/league-combination-comparison.json"
      - name: Independently compile and check exact selected source
        run: |
          set -o pipefail
          export PATH=/usr/bin:/bin
          for compiler_env_name in ${!LD_@}; do unset "$compiler_env_name"; done
          unset CC CXX CPP AS AR LD GCC_EXEC_PREFIX COMPILER_PATH LIBRARY_PATH CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH OBJC_INCLUDE_PATH CFLAGS CPPFLAGS CXXFLAGS LDFLAGS
          P="$RUNNER_TEMP/league-combination-python/bin/python3"
          SOURCE="$RUNNER_TEMP/league-combination/build"
          OUT="$RUNNER_TEMP/league-combination-ubuntu22"
          mkdir "$OUT"
          "$P" -I -B engines/experiments/tcec-next/profile_compiler.py \
            --build "$SOURCE" --compiler /usr/bin/cc --ubuntu22-system --program-provenance \
            --out "$OUT/compiler" 2>&1 | tee "$OUT/compiler.log"
          "$P" -I -B engines/experiments/tcec-next/profile_rules.py \
            --family "$FAMILY" --profile "$PROFILE" --source "$SOURCE/main.c" \
            --baseline "$SOURCE/control/main.c" --proof "$SOURCE/source-proof.json" \
            --build "$SOURCE" --cc /usr/bin/cc --out "$OUT/rules" 2>&1 | tee "$OUT/rules.log"
      - name: Preserve comparison and independent compiler and rules evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: league-combination-${{ matrix.family }}-${{ matrix.profile }}-${{ matrix.variant }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/league-combination-comparison.json
            ${{ runner.temp }}/league-combination-ubuntu22
          if-no-files-found: ignore
          retention-days: 7

  compare-b-atomic:
    needs: generate
    if: always() && needs.generate.result != 'cancelled' && needs.generate.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [test-p16, test-p192]
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download the actual B parent for this commit and attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: league-source-B-${{ matrix.profile }}-tcec-final-lf-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b-atomic-parent
      - name: Download the actual B atomic candidate for this commit and attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: league-source-B-${{ matrix.profile }}-league-atomic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b-atomic-candidate
      - name: Compare the actual B stage, cc and ld identities and complete files
        run: |
          python -I -B - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          parent, candidate = root / 'b-atomic-parent', root / 'b-atomic-candidate'
          records = [json.loads((item / 'build/build.json').read_text()) for item in (parent, candidate)]
          audits = [json.loads((item / 'artifact-audit.json').read_text()) for item in (parent, candidate)]
          if any(record['family'] != 'B' or record['resources']['id'] != os.environ['PROFILE']
                 or record['complete'] is not True or record['reproducible'] is not True for record in records):
              raise ValueError('B atomic cost family, profile or producer completion differs')
          if [audit['variant'] for audit in audits] != ['tcec-final-lf', 'league-atomic']:
              raise ValueError('B atomic comparison inputs are not the requested pair')
          post = {'path': 'engines/experiments/tcec-next/profile_b.py', 'variant': 'tcec-final-lf'}
          atomic = {'path': 'engines/experiments/tcec-next/profile_b_league_spelling.py',
                    'selection': 'league-atomic', 'variant': 'atomic-assignment'}
          if (any(record.get('post_profile') != post for record in records)
                  or records[0].get('post_spelling') is not None
                  or records[1].get('post_spelling') != atomic):
              raise ValueError('B atomic comparison source-stage declarations differ')
          for key in ('compiler', 'compile_executor', 'compile_executor_version', 'compression'):
              if records[0][key] != records[1][key]:
                  raise ValueError('B atomic compiler or compression differs: ' + key)
          for path in ('resource-projection.c', 'b-projection.c', 'build/control/main.c', 'build/header.sh',
                       'compiler-sha256.txt', 'linker-sha256.txt'):
              if (parent / path).read_bytes() != (candidate / path).read_bytes():
                  raise ValueError('B atomic parent or wrapper differs: ' + path)
          if (parent / 'build/main.c').read_bytes() != (candidate / 'b-projection.c').read_bytes():
              raise ValueError('actual parent main.c differs from candidate B-stage input')
          files = [(item / 'build/x').read_bytes() for item in (parent, candidate)]
          def actual(data):
              return {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          if any(audit['parts']['x'] != actual(data) for audit, data in zip(audits, files)):
              raise ValueError('actual B atomic whole file differs from its producer audit')
          atomic_source = (candidate / 'atomic-projection.c').read_bytes()
          if records[1]['source_proofs'][2]['output'] != actual(atomic_source):
              raise ValueError('atomic pre-cleanup source differs from the producer proof')
          def load_live(name, relative):
              path = Path(relative).resolve()
              live = path.read_bytes()
              if any((item / 'build/inputs' / relative).read_bytes() != live for item in (parent, candidate)):
                  raise ValueError('tracked same-host packaging helper differs from a frozen producer input: ' + relative)
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              return module
          packaging = load_live('league_ci_atomic_package', 'engines/scripts/source_package.py')
          wrapper = load_live('league_ci_atomic_wrapper', 'engines/experiments/tcec-next/wrapper.py')
          unlink = load_live('league_ci_atomic_unlink', 'engines/experiments/tcec-next/self_unlink.py')
          stages = [(parent / 'build/main.c').read_bytes(), atomic_source,
                    (candidate / 'build/main.c').read_bytes()]
          replay = [wrapper.package(packaging, unlink, source, records[0]['compression'], records[0]['compiler'])
                    for source in stages]
          def scope(item):
              rules = item / 'rules/probe/rules.json'
              commands = item / 'rules/commands.json'
              admission = item / 'admission.json'
              complete = False
              if rules.is_file() and commands.is_file():
                  probe = json.loads(rules.read_text())
                  receipt = json.loads(commands.read_text())
                  rows = receipt.get('commands', [])
                  expected = ['rules-compile-plain', 'rules-execute-plain',
                              'rules-compile-ubsan', 'rules-execute-ubsan']
                  complete = (probe.get('complete') is True and receipt.get('complete') is True
                      and receipt.get('host_cleanup') == {'unsettled_commands': 0, 'errors': []}
                      and [row.get('kind') for row in rows] == expected
                      and all(row.get('returncode') == 0 and row.get('terminal') is True
                          and row.get('reaped') is True and row.get('owned_group_absent') is True
                          and row.get('forced_cleanup') is False for row in rows))
              return {'rules_complete': complete,
                      'strict_source_admission': admission.is_file() and
                          json.loads(admission.read_text()).get('strict_source_admission') is True}
          report = {'profile': os.environ['PROFILE'], 'family': 'B',
                    'tcec_final_lf': actual(files[0]), 'league_atomic': actual(files[1]),
                    'actual_atomic_and_dependency_minus_parent_bytes': len(files[1]) - len(files[0]),
                    'same_host_repackaging': {
                        'parent': actual(replay[0]), 'atomic_before_dependency_cleanup': actual(replay[1]),
                        'atomic_after_dependency_cleanup': actual(replay[2]),
                        'atomic_only_minus_parent_bytes': len(replay[1]) - len(replay[0]),
                        'dependency_cleanup_minus_atomic_bytes': len(replay[2]) - len(replay[1]),
                        'matches_original_files': [replay[0] == files[0], replay[2] == files[1]]},
                    'candidate_at_most_4096': len(files[1]) <= 4096,
                    'parent_validation': scope(parent), 'candidate_validation': scope(candidate),
                    'tool_identity_scope': 'cc and ld binaries, compiler version and arguments; not the full toolchain or system image',
                    'production_selected': False, 'runtime_qualified': False,
                    'physical_placement_qualified': False, 'playing_strength_qualified': False}
          out = root / 'b-atomic-comparison.json'
          out.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Preserve the B atomic whole-file comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: league-B-atomic-comparison-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b-atomic-comparison.json
          if-no-files-found: error
          retention-days: 7
