name: Experimental full EP profiles

on:
  pull_request:
    paths:
      - 'engines/**'
      - '.github/workflows/ep-profiles.yml'

permissions:
  contents: read

concurrency:
  group: full-ep-profiles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: C, scan: square-successor}
          - {family: E, scan: control}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned development-only oracle dependencies
        run: python -m pip install --require-hashes -r engines/training/e19/requirements.txt
      - name: Generate and verify the full opt-in P4 EP artifact and seal its source
        run: >-
          python -I -B engines/scripts/production_ci.py
          --family '${{ matrix.family }}' --profile test-p4
          --spelling-variant compound --scan-variant '${{ matrix.scan }}'
          --ep-variant legal-maker --export-source-bundle
          --out '${{ runner.temp }}/rove4k-ep-profile-${{ matrix.family }}-${{ github.run_attempt }}'
      - name: Transfer the exact source for the independent Ubuntu22 consumer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ep-source-${{ matrix.family }}-test-p4-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rove4k-ep-profile-${{ matrix.family }}-${{ github.run_attempt }}/source-bundle.zip
            ${{ runner.temp }}/rove4k-ep-profile-${{ matrix.family }}-${{ github.run_attempt }}/source-seal.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve actual source, mechanism, rules, runtime and original failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ep-profile-${{ matrix.family }}-test-p4-${{ github.sha }}
          path: ${{ runner.temp }}/rove4k-ep-profile-${{ matrix.family }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 7

  ubuntu22:
    needs: producer
    if: ${{ always() && needs.producer.result != 'cancelled' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family: [C, E]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ep-source-${{ matrix.family }}-test-p4-${{ github.sha }}
          path: ${{ runner.temp }}/rove4k-ep-source-${{ matrix.family }}-${{ github.run_attempt }}
      - name: Prepare the system Python without redirecting the actual target compiler
        run: |
          export PATH=/usr/bin:/bin
          for compiler_env_name in ${!LD_@}; do unset "$compiler_env_name"; done
          unset CC CXX CPP AS AR LD GCC_EXEC_PREFIX COMPILER_PATH LIBRARY_PATH CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH OBJC_INCLUDE_PATH CFLAGS CPPFLAGS CXXFLAGS LDFLAGS
          /usr/bin/python3 -m venv "$RUNNER_TEMP/rove4k-ep-system22-python"
          "$RUNNER_TEMP/rove4k-ep-system22-python/bin/python3" -m pip install --require-hashes -r engines/training/e19/requirements.txt
      - name: Compile, check actual rules and run the same sealed EP source on Ubuntu22
        run: |
          export PATH=/usr/bin:/bin
          for compiler_env_name in ${!LD_@}; do unset "$compiler_env_name"; done
          unset CC CXX CPP AS AR LD GCC_EXEC_PREFIX COMPILER_PATH LIBRARY_PATH CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH OBJC_INCLUDE_PATH CFLAGS CPPFLAGS CXXFLAGS LDFLAGS
          "$RUNNER_TEMP/rove4k-ep-system22-python/bin/python3" -I -B engines/scripts/production_ci.py \
            --family '${{ matrix.family }}' --profile test-p4 --ubuntu22-target \
            --source-bundle "$RUNNER_TEMP/rove4k-ep-source-${{ matrix.family }}-${{ github.run_attempt }}/source-bundle.zip" \
            --source-seal "$RUNNER_TEMP/rove4k-ep-source-${{ matrix.family }}-${{ github.run_attempt }}/source-seal.json" \
            --out "$RUNNER_TEMP/rove4k-ep-target22-${{ matrix.family }}-${{ github.run_attempt }}"
      - name: Preserve independent compiler, rules, runtime and original failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ep-ubuntu22-${{ matrix.family }}-test-p4-${{ github.sha }}
          path: ${{ runner.temp }}/rove4k-ep-target22-${{ matrix.family }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 7
