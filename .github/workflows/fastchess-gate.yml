name: Fastchess start gate

on:
  push:
    branches: [main, develop]
    paths:
      - 'engines/experiments/strength/fastchess.py'
      - 'engines/experiments/strength/sealed_opening_exec.py'
      - 'engines/experiments/strength/test_sealed_opening_exec.py'
      - 'engines/experiments/strength/original_peer_uci.py'
      - 'engines/experiments/strength/test_fastchess.py'
      - 'engines/experiments/strength/test_fastchess_write.py'
      - 'engines/experiments/strength/test_fastchess_closed_stdio.py'
      - 'engines/experiments/strength/wave.py'
      - 'engines/experiments/strength/test_wave.py'
      - 'engines/experiments/strength/patches/fastchess-rove.patch'
      - '.github/workflows/fastchess-gate.yml'
  pull_request:
    paths:
      - 'engines/experiments/strength/fastchess.py'
      - 'engines/experiments/strength/sealed_opening_exec.py'
      - 'engines/experiments/strength/test_sealed_opening_exec.py'
      - 'engines/experiments/strength/original_peer_uci.py'
      - 'engines/experiments/strength/test_fastchess.py'
      - 'engines/experiments/strength/test_fastchess_write.py'
      - 'engines/experiments/strength/test_fastchess_closed_stdio.py'
      - 'engines/experiments/strength/wave.py'
      - 'engines/experiments/strength/test_wave.py'
      - 'engines/experiments/strength/patches/fastchess-rove.patch'
      - '.github/workflows/fastchess-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastchess-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pinned-runner:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned public runner and reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B engines/experiments/strength/fastchess.py prepare --out "$RUNNER_TEMP/fastchess-source"
          test -s "$RUNNER_TEMP/fastchess-source/LICENSE"
      - name: Build the exact prepared runner
        shell: bash
        run: |
          set -euo pipefail
          cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          python3 -I -B engines/experiments/strength/fastchess.py build --source "$RUNNER_TEMP/fastchess-source" --out "$RUNNER_TEMP/fastchess-build" --cpu "$cpu"
      - name: Exercise actual runner gate and WaveExecutor with mock UCI engines
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B engines/experiments/strength/test_fastchess.py --build "$RUNNER_TEMP/fastchess-build/build.json" --out "$RUNNER_TEMP/fastchess-runtime"
          python3 -I -B engines/experiments/strength/test_wave.py --build "$RUNNER_TEMP/fastchess-build/build.json" --out "$RUNNER_TEMP/fastchess-wave-runtime"
      - name: Exercise partial and failed engine-input writes
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B engines/experiments/strength/test_fastchess_write.py --source "$RUNNER_TEMP/fastchess-source" --build "$RUNNER_TEMP/fastchess-build/build.json" --out "$RUNNER_TEMP/fastchess-write-runtime"
      - name: Exercise engine launch with closed standard descriptors
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B engines/experiments/strength/test_fastchess_closed_stdio.py --source "$RUNNER_TEMP/fastchess-source" --build "$RUNNER_TEMP/fastchess-build/build.json" --out "$RUNNER_TEMP/fastchess-closed-stdio"
      - name: Preserve bounded build and protocol evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastchess-gate-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/fastchess-source/rove-preparation.json
            ${{ runner.temp }}/fastchess-source/prepare-*.log
            ${{ runner.temp }}/fastchess-source/prepare-*.command.json
            ${{ runner.temp }}/fastchess-source/LICENSE
            ${{ runner.temp }}/fastchess-build/build.json
            ${{ runner.temp }}/fastchess-build/build.log
            ${{ runner.temp }}/fastchess-build/build.command.json
            ${{ runner.temp }}/fastchess-write-runtime/write-fault.json
            ${{ runner.temp }}/fastchess-closed-stdio/closed-stdio.json
            ${{ runner.temp }}/fastchess-runtime/runtime.json
            ${{ runner.temp }}/fastchess-runtime/*/runner.log
            ${{ runner.temp }}/fastchess-runtime/*/*.jsonl
            ${{ runner.temp }}/fastchess-runtime/*/game.pgn
            ${{ runner.temp }}/fastchess-runtime/*/raw.log
            ${{ runner.temp }}/fastchess-wave-runtime/actual-wave.json
            ${{ runner.temp }}/fastchess-wave-runtime/*/*/*.jsonl
            ${{ runner.temp }}/fastchess-wave-runtime/*/*/game.pgn
            ${{ runner.temp }}/fastchess-wave-runtime/*/*/raw.log
            ${{ runner.temp }}/fastchess-wave-runtime/*/*/runner.*.log
            ${{ runner.temp }}/fastchess-wave-runtime/*/*/wave-observation.json
