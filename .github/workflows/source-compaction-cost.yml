name: Experimental source compaction cost

on:
  pull_request:
    paths:
      - 'engines/**'
      - '.github/workflows/source-compaction-cost.yml'

permissions:
  contents: read

concurrency:
  group: source-compaction-cost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check the shared cost controller without native execution
        run: |
          set -o pipefail
          python -I -B engines/experiments/tcec-next/test_terminal_cost.py \
            2>&1 | tee '${{ runner.temp }}/rove4k-source-cost-contracts-${{ github.run_attempt }}.log'
      - name: Check the finite mate source domain without native execution
        run: |
          set -o pipefail
          python -I -B engines/experiments/tcec-next/test_compact_mate.py \
            2>&1 | tee '${{ runner.temp }}/rove4k-mate-source-contracts-${{ github.run_attempt }}.log'
      - name: Check the finite EP source domain without native execution
        run: |
          set -o pipefail
          python -I -B engines/experiments/tcec-next/test_compact_ep.py \
            2>&1 | tee '${{ runner.temp }}/rove4k-ep-source-contracts-${{ github.run_attempt }}.log'
          python -I -B engines/experiments/tcec-next/test_check_ep.py \
            2>&1 | tee '${{ runner.temp }}/rove4k-ep-fixture-contracts-${{ github.run_attempt }}.log'
      - name: Check the finite castle source proof and actual-generator fixture renderer
        run: |
          python -I -B engines/experiments/tcec-next/test_compact_castle.py
          python -I -B engines/experiments/tcec-next/test_check_castle.py
      - name: Preserve original source-contract results and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-compaction-contracts-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rove4k-source-cost-contracts-${{ github.run_attempt }}.log
            ${{ runner.temp }}/rove4k-mate-source-contracts-${{ github.run_attempt }}.log
            ${{ runner.temp }}/rove4k-ep-source-contracts-${{ github.run_attempt }}.log
            ${{ runner.temp }}/rove4k-ep-fixture-contracts-${{ github.run_attempt }}.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  castle-cost:
    needs: source-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        entry: [A, C, E]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compare whole costs and actual ordered castle generation in plain and fatal UBSan modes
        # W256 remains a source/compile/fragment trial. Original main, workers,
        # search and the declared large TT are never started.
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 600s \
            python -I -B engines/experiments/tcec-next/terminal_cost.py \
            --entry '${{ matrix.entry }}' --experiment castle --profile tcec-provisional \
            --out '${{ runner.temp }}/rove4k-castle-cost-${{ matrix.entry }}-${{ github.run_attempt }}' --execute \
            2>&1 | tee '${{ runner.temp }}/rove4k-castle-cost-${{ matrix.entry }}-${{ github.run_attempt }}.log'
      - name: Preserve both diagnostics, whole costs and original failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-compaction-castle-${{ matrix.entry }}-tcec-provisional-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rove4k-castle-cost-${{ matrix.entry }}-${{ github.run_attempt }}
            ${{ runner.temp }}/rove4k-castle-cost-${{ matrix.entry }}-${{ github.run_attempt }}.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  ep-cost:
    needs: source-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        entry: [C, E]
        profile: [test-p4, test-p28, tcec-provisional]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compare the EP maker-sharing candidate and actual-source rules probe
        # This preliminary fatal-UBSan probe uses the existing independent
        # start-derived oracle. It does not claim arbitrary FEN or engine runtime.
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 600s \
            python -I -B engines/experiments/tcec-next/terminal_cost.py \
            --entry '${{ matrix.entry }}' --experiment ep \
            --profile '${{ matrix.profile }}' \
            --out '${{ runner.temp }}/rove4k-ep-cost-${{ matrix.entry }}-${{ matrix.profile }}-${{ github.run_attempt }}' \
            --execute \
            2>&1 | tee '${{ runner.temp }}/rove4k-ep-cost-${{ matrix.entry }}-${{ matrix.profile }}-${{ github.run_attempt }}.log'
      - name: Render the actual original and candidate EP functions for targeted pin cases
        env:
          ENTRY: ${{ matrix.entry }}
          PROFILE: ${{ matrix.profile }}
          EP_OUT: ${{ runner.temp }}/rove4k-ep-cost-${{ matrix.entry }}-${{ matrix.profile }}-${{ github.run_attempt }}
        run: |
          python -I -B - <<'PY'
          import importlib.util, json, os, sys
          from pathlib import Path
          root = Path.cwd()
          def module(name, path):
              spec = importlib.util.spec_from_file_location(name, root / path)
              value = importlib.util.module_from_spec(spec)
              sys.modules[name] = value
              spec.loader.exec_module(value)
              return value
          prefix = 'engines/experiments/tcec-next/'
          ep = module('targeted_ep_helper', prefix + 'compact_ep.py')
          projection = module('targeted_ep_projection', prefix + 'spelling_compound.py')
          oracle = module('targeted_ep_oracle', 'engines/tests/chess_oracle.py')
          check = module('targeted_ep_renderer', prefix + 'check_ep.py')
          out = Path(os.environ['EP_OUT'])
          source = (out / 'fresh-profile/main.c').read_bytes()
          fixture, metadata = check.render_fixture(source, family=os.environ['ENTRY'],
              profile_id=os.environ['PROFILE'], ep=ep, projection=projection, oracle=oracle)
          (out / 'targeted-ep.c').write_bytes(fixture)
          (out / 'targeted-ep.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
      - name: Compare EP legality and full Board preservation in plain and fatal UBSan modes
        env:
          ENTRY: ${{ matrix.entry }}
          EP_OUT: ${{ runner.temp }}/rove4k-ep-cost-${{ matrix.entry }}-${{ matrix.profile }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          isa=()
          if [ "$ENTRY" = C ]; then isa=(-mavx2); fi
          for mode in plain ubsan; do
            sanitizer=()
            if [ "$mode" = ubsan ]; then sanitizer=(-fsanitize=undefined -fno-sanitize-recover=undefined); fi
            timeout --signal=TERM --kill-after=3s 45s \
              prlimit --as=2147483648 --cpu=40:45 --fsize=8388608 \
              cc -std=c11 -O1 -pthread -g0 "${isa[@]}" "${sanitizer[@]}" \
              "$EP_OUT/targeted-ep.c" -o "$EP_OUT/targeted-ep-$mode" \
              > "$EP_OUT/targeted-$mode-compile.stdout" 2> "$EP_OUT/targeted-$mode-compile.stderr"
            timeout --signal=TERM --kill-after=3s 45s \
              prlimit --as=2147483648 --cpu=40:45 --fsize=8388608 \
              "$EP_OUT/targeted-ep-$mode" \
              > "$EP_OUT/targeted-$mode.stdout" 2> "$EP_OUT/targeted-$mode.stderr"
            test ! -s "$EP_OUT/targeted-$mode-compile.stderr"
            test ! -s "$EP_OUT/targeted-$mode.stderr"
          done
          python -I -B - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['EP_OUT'])
          planned = json.loads((out / 'targeted-ep.json').read_bytes())
          expected = {'cases': len(planned['cases']),
              'normalizer_pairs': planned['expected_normalizer_pairs'],
              'direct_trials': planned['expected_direct_trials'],
              'full_board_equal': True, 'trial_const_input': True}
          for mode in ('plain', 'ubsan'):
              observed = json.loads((out / ('targeted-' + mode + '.stdout')).read_bytes())
              if json.dumps(observed, sort_keys=True) != json.dumps(expected, sort_keys=True):
                  raise SystemExit('targeted EP observation differs: ' + mode)
          print(json.dumps(expected, sort_keys=True))
          PY
      - name: Preserve complete EP costs and original diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-compaction-ep-${{ matrix.entry }}-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rove4k-ep-cost-${{ matrix.entry }}-${{ matrix.profile }}-${{ github.run_attempt }}
            ${{ runner.temp }}/rove4k-ep-cost-${{ matrix.entry }}-${{ matrix.profile }}-${{ github.run_attempt }}.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  mate-cost:
    needs: source-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        entry: [A, B, C, E]
        variant: [folded, shared]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compare one mate form and its actual-fragment UBSan diagnostic
        # The controller includes capture in 600 seconds, then allows cleanup.
        # The diagnostic executes integer fragments, never an engine or TT.
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 600s \
            python -I -B engines/experiments/tcec-next/terminal_cost.py \
            --entry '${{ matrix.entry }}' \
            --experiment mate \
            --variant '${{ matrix.variant }}' \
            --out '${{ runner.temp }}/rove4k-mate-cost-${{ matrix.entry }}-${{ matrix.variant }}-${{ github.run_attempt }}' \
            --execute \
            2>&1 | tee '${{ runner.temp }}/rove4k-mate-cost-${{ matrix.entry }}-${{ matrix.variant }}-${{ github.run_attempt }}.log'
      - name: Preserve complete costs, diagnostics and original failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-compaction-mate-${{ matrix.entry }}-${{ matrix.variant }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rove4k-mate-cost-${{ matrix.entry }}-${{ matrix.variant }}-${{ github.run_attempt }}
            ${{ runner.temp }}/rove4k-mate-cost-${{ matrix.entry }}-${{ matrix.variant }}-${{ github.run_attempt }}.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
