name: Experimental terminal query cost

on:
  pull_request:
    paths:
      - 'engines/**'
      - '.github/workflows/terminal-query-cost.yml'

permissions:
  contents: read

concurrency:
  group: terminal-query-cost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terminal-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        entry: [A, E]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check the fixed source-only controller boundaries
        run: python -I -B engines/experiments/tcec-next/test_terminal_cost.py
      - name: Compare one terminal-query candidate without engine execution
        # The caller's total envelope includes capture and 30 seconds of cleanup.
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 600s \
            python -I -B engines/experiments/tcec-next/terminal_cost.py \
            --entry '${{ matrix.entry }}' \
            --out '${{ runner.temp }}/rove4k-terminal-cost-${{ matrix.entry }}-${{ github.run_attempt }}' \
            --execute \
            2>&1 | tee '${{ runner.temp }}/rove4k-terminal-cost-${{ matrix.entry }}-${{ github.run_attempt }}.log'
      - name: Preserve cost observations and original failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experimental-terminal-cost-${{ matrix.entry }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rove4k-terminal-cost-${{ matrix.entry }}-${{ github.run_attempt }}
            ${{ runner.temp }}/rove4k-terminal-cost-${{ matrix.entry }}-${{ github.run_attempt }}.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
