name: NVCompact
on:
  push:
    branches: [main, develop]
    paths: ['tools/nvcompact/**', 'Cargo.toml', 'Cargo.lock', 'package.json', 'package-lock.json', '.github/workflows/nvcompact.yml', '.github/workflows/nvcompact-publish.yml']
  pull_request:
    paths: ['tools/nvcompact/**', 'Cargo.toml', 'Cargo.lock', 'package.json', 'package-lock.json', '.github/workflows/nvcompact.yml', '.github/workflows/nvcompact-publish.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nvcompact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-and-npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_BUILD_JOBS: 2
      NVCOMPACT_CLANG: clang
    steps:
      - name: Configure external build directories
        run: |
          printf 'CARGO_TARGET_DIR=%s/rove4k-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'NVCOMPACT_ARTIFACT_DIR=%s/nvcompact-artifacts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the release npm CLI
        run: |
          NVC_NPM_CLI=$(node -p "require('./tools/nvcompact/scripts/release-config.json').npm_cli_version")
          npm install --global "npm@$NVC_NPM_CLI" --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Prepare native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang build-essential pkg-config liblzma-dev libbz2-dev zlib1g-dev xz-utils bzip2
          rustup toolchain install 1.99.1 --profile minimal
      - name: Install workspace launcher
        run: npm ci --ignore-scripts
      - name: Verify launcher ownership and argv
        run: npm test
      - name: Verify release boundaries without publishing
        run: npm run test:release
      - name: Test Rust implementation and owned fixtures
        run: npm run test:core
      - name: Build native internal tool
        run: npm run build:nvcompact
      - name: Prepare complete local npm tarball
        run: npm run pack:nvcompact -- --no-build
      - name: Verify actual offline-installed tarball
        run: npm run verify:package
