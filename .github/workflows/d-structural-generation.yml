name: Experimental D generation

on:
  pull_request:
    paths:
      - 'engines/experiments/tiny-d-submission/**'
      - 'engines/experiments/tcec-scope/build.py'
      - 'engines/compact/tiny-entry-d/**'
      - 'engines/common/**'
      - 'engines/scripts/minify.py'
      - 'engines/scripts/rename_c.py'
      - 'engines/scripts/production.py'
      - 'engines/scripts/source_composition.py'
      - '.github/workflows/d-structural-generation.yml'

permissions:
  contents: read

concurrency:
  group: d-structural-generation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generation-only:
    # D is outside the current A/B/C/E/F league branch. Other PRs retain CI.
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'feature/rove4k-engines-af' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check the finite producer without compilation or encoding
        run: python -I -B engines/experiments/tiny-d-submission/test_build_structural.py
      - name: Reproduce experimental P4 native and carriers without engine execution
        # INT reaches the existing Host signal handler and finish_report cleanup.
        # 240 seconds of work plus 20 seconds of cleanup also cover source capture.
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=20s 240s \
            python -I -B engines/experiments/tiny-d-submission/build_structural.py \
            --profile test-p4 --variant fast-capacity \
            --out '${{ runner.temp }}/rove4k-D-structural-generation-${{ github.run_attempt }}' \
            --execute 2>&1 | tee '${{ runner.temp }}/rove4k-D-structural-generation-${{ github.run_attempt }}.log'
      - name: Preserve generation evidence and failures without production selection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experimental-D-generation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rove4k-D-structural-generation-${{ github.run_attempt }}
            ${{ runner.temp }}/rove4k-D-structural-generation-${{ github.run_attempt }}.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  bss-cost-only:
    # User paused D compression on 2026-10-27. Keep the implementation and
    # previous evidence; resume this experiment only after a new instruction.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check fixed production gates and cost-only source contracts
        run: |
          python -I -B engines/experiments/tiny-d-submission/test_build_structural.py
          python -I -B engines/experiments/tiny-d-submission/test_structural_bss_cost.py
      - name: Compare one BSS candidate and inspect TT33 ELF layout without execution
        # Includes source capture: 600 seconds work, then 30 seconds for cleanup.
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 600s \
            python -I -B engines/experiments/tiny-d-submission/structural_bss_cost.py \
            --out '${{ runner.temp }}/rove4k-D-bss-cost-${{ github.run_attempt }}' \
            --execute --tt33-layout \
            2>&1 | tee '${{ runner.temp }}/rove4k-D-bss-cost-${{ github.run_attempt }}.log'
      - name: Preserve bounded cost and compile-only layout evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experimental-D-bss-cost-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rove4k-D-bss-cost-${{ github.run_attempt }}
            ${{ runner.temp }}/rove4k-D-bss-cost-${{ github.run_attempt }}.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
