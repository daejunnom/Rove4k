name: Experimental exact P192 peer production

on:
  pull_request:
    paths:
      - 'engines/experiments/strength/peer_p192_exact.py'
      - 'engines/experiments/strength/peer_p192_exact_build.py'
      - 'engines/experiments/strength/test_peer_p192_exact*.py'
      - 'engines/experiments/strength/peer_exact_runner.py'
      - 'engines/experiments/strength/test_peer_exact_runner.py'
      - 'engines/experiments/strength/peer_exact_proposal.py'
      - 'engines/experiments/strength/test_peer_exact_proposal.py'
      - 'engines/experiments/strength/registry.py'
      - 'engines/experiments/strength/peer_launcher_trim.py'
      - 'engines/experiments/strength/test_peer_launcher_trim.py'
      - 'engines/experiments/strength/peer_ice_structural.py'
      - 'engines/experiments/strength/test_peer_ice_structural.py'
      - 'engines/experiments/strength/peer_c4ke_structural.py'
      - 'engines/experiments/strength/test_peer_c4ke_structural.py'
      - 'engines/experiments/strength/peer_c4ke_edit_structural.py'
      - 'engines/experiments/strength/test_peer_c4ke_edit_structural.py'
      - 'engines/experiments/strength/peer_c4ke_slider_loop.py'
      - 'engines/experiments/strength/test_peer_c4ke_slider_loop.py'
      - 'engines/experiments/strength/peer_c4ke_startpos_loop.py'
      - 'engines/experiments/strength/test_peer_c4ke_startpos_loop.py'
      - 'engines/experiments/strength/peer_c4ke_quiet_history.py'
      - 'engines/experiments/strength/test_peer_c4ke_quiet_history.py'
      - 'engines/experiments/strength/peer_c4ke_move_emission.py'
      - 'engines/experiments/strength/test_peer_c4ke_move_emission.py'
      - 'engines/experiments/strength/peer_c4ke_phalanx.py'
      - 'engines/experiments/strength/test_peer_c4ke_phalanx.py'
      - 'engines/experiments/strength/peer_c4ke_attack_pawns.py'
      - 'engines/experiments/strength/test_peer_c4ke_attack_pawns.py'
      - 'engines/experiments/strength/peer_c4ke_ep_hash.py'
      - 'engines/experiments/strength/test_peer_c4ke_ep_hash.py'
      - 'engines/experiments/strength/peer_c4ke_pop_lsb.py'
      - 'engines/experiments/strength/test_peer_c4ke_pop_lsb.py'
      - 'engines/experiments/strength/peers.py'
      - 'engines/experiments/strength/test_peers.py'
      - '.github/workflows/peer-p192-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peer-p192-exact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  produce:
    # Historical transformed-peer size experiment; league comparisons use
    # unchanged upstream peers and do not run this matrix on pull requests.
    if: github.event_name == 'workflow_dispatch'
    name: exact-P192-${{ matrix.peer }}-${{ matrix.variant }}-${{ matrix.launcher }}-${{ matrix.codec }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {peer: ice4, variant: baseline, launcher: upstream, codec: compact}
          - {peer: ice4, variant: baseline, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: baseline, launcher: upstream, codec: compact}
          - {peer: c4ke, variant: baseline, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: share-v1, launcher: upstream, codec: compact}
          - {peer: c4ke, variant: share-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: share-v1, launcher: gnu-tail-v1, codec: extended}
          - {peer: c4ke, variant: slot-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: ray-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: slot-ray-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: ice4, variant: castle-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: ice4, variant: zobrist-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: ice4, variant: castle-zobrist-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: castle-or-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: ray-castle-or-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: edit-loop-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: edit-castle-or-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: edit-castle-or-v1, launcher: gnu-tail-v1, codec: extended}
          - {peer: c4ke, variant: edit-castle-alloc24-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: edit-castle-or-v1, launcher: gnu-tail-v1, codec: literal-v1}
          - {peer: c4ke, variant: edit-castle-slider-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: edit-castle-startpos-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: edit-castle-quiet-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: edit-castle-emission-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: edit-castle-phalanx-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: edit-castle-phalanx-attack-pawns-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: edit-castle-phalanx-attack-pawns-v1, launcher: gnu-tail-v1, codec: extended}
          - {peer: c4ke, variant: edit-castle-phalanx-ep-hash-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: edit-castle-phalanx-ep-hash-v1, launcher: gnu-tail-v1, codec: extended}
          - {peer: c4ke, variant: edit-castle-phalanx-pop-lsb-v1, launcher: gnu-tail-v1, codec: compact}
          - {peer: c4ke, variant: edit-castle-phalanx-pop-lsb-v1, launcher: gnu-tail-v1, codec: extended}
          - {peer: c4ke, variant: edit-castle-phalanx-v1, launcher: gnu-tail-v1, codec: extended}
          - {peer: c4ke, variant: edit-castle-phalanx-v1, launcher: gnu-tail-v1, codec: literal-v1}
    env:
      PEER: ${{ matrix.peer }}
      SOURCE_VARIANT: ${{ matrix.variant }}
      LAUNCHER_VARIANT: ${{ matrix.launcher }}
      CODEC_SEARCH: ${{ matrix.codec }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check exact P192 transform and producer contracts
        run: |
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_p192_exact*.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_exact_runner.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_exact_proposal.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_launcher_trim.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_ice_structural.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_c4ke_structural.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_c4ke_edit_structural.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_c4ke_slider_loop.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_c4ke_startpos_loop.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_c4ke_quiet_history.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_c4ke_move_emission.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_c4ke_phalanx.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_c4ke_attack_pawns.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_c4ke_ep_hash.py'
          python -B -m unittest discover -s engines/experiments/strength -p 'test_peer_c4ke_pop_lsb.py'
          python -B -m unittest -v \
            engines.experiments.strength.test_peers.PeerInputs.test_literal_search_roundtrips_repeats_and_orders_ties \
            engines.experiments.strength.test_peers.PeerInputs.test_existing_codec_profiles_retain_previous_rows
      - name: Fetch only pinned upstream source into temporary storage
        run: |
          python -I -B engines/experiments/strength/peers.py source \
            --peer "$PEER" --out "$RUNNER_TEMP/peer-p192-source-$PEER"
      - name: Produce two independent transformed packages without engine execution
        run: |
          rove_rust_args=()
          if [ "$PEER" = ice4 ]; then
            rove_rustup_home="$(rustup show home)"
            test -d "$rove_rustup_home"
            rove_rust_args=(--rustup-home "$rove_rustup_home")
          fi
          timeout --signal=TERM --kill-after=30s 2100s \
            python -I -B engines/experiments/strength/peer_p192_exact_build.py \
            --peer "$PEER" --source "$RUNNER_TEMP/peer-p192-source-$PEER" \
            --out "$RUNNER_TEMP/peer-p192-result-$PEER" \
            --source-variant "$SOURCE_VARIANT" --launcher-variant "$LAUNCHER_VARIANT" \
            --codec-search "$CODEC_SEARCH" --wall-seconds 600 "${rove_rust_args[@]}"
      - name: Inspect retained exact source and whole evidence without admission
        run: |
          python - "$RUNNER_TEMP/peer-p192-result-$PEER/peer-exact.json" <<'PY'
          import hashlib, json, pathlib, sys
          from engines.experiments.strength import registry
          receipt = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(receipt.read_bytes()).hexdigest()
          result = registry.inspect_exact_peer_proposal(receipt, digest)
          assert result['source_snapshot_inverse_verified']
          assert result['retained_source_whole_consistent']
          assert not result['minifier_execution_replayed']
          assert not result['emitted_tt_semantics_verified']
          assert not result['native_reference_verified']
          assert not result['eligible_for_diagnostic']
          assert not result['eligible_for_scored_league']
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Check emitted C++ syntax with the peer launcher options
        run: |
          if [ "$PEER" = c4ke ]; then
            g++ -O3 -std=c++23 -pthread -march=native -xc++ -fsyntax-only \
              "$RUNNER_TEMP/peer-p192-result-$PEER/attempt-1/main.cpp"
          else
            c++ -O3 -pthread -xc++ -fsyntax-only \
              "$RUNNER_TEMP/peer-p192-result-$PEER/attempt-1/main.cpp"
          fi
      - name: Check selected LZMA stream with xz
        run: |
          python - "$RUNNER_TEMP/peer-p192-result-$PEER" <<'PY'
          import json, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          report = json.loads((root / 'peer-exact.json').read_text())
          for attempt in report['attempts']:
              package = pathlib.Path(attempt['whole']['path']).read_bytes()
              source = (pathlib.Path(attempt['whole']['path']).parent / 'main.cpp').read_bytes()
              restored = subprocess.run(['xz', '--format=lzma', '--decompress', '--stdout'],
                                        input=package[attempt['header']['bytes']:],
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True).stdout
              if restored != source:
                  raise SystemExit('xz output differs from the generated source')
          print('xz restored both selected streams; launcher eligibility remains unverified')
          PY
      - name: Report actual whole-file size and admission scope
        run: |
          python - "$RUNNER_TEMP/peer-p192-result-$PEER/peer-exact.json" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report['complete'] and report['reproducible']
          assert not report['qualification']['emitted_tt_semantics_verified']
          assert not report['qualification']['runtime_qualified']
          assert not report['qualification']['league_qualified']
          print(json.dumps({'peer': report['peer'], 'profile': report['profile'],
                            'source_variant': report.get('source_variant', 'baseline'),
                            'launcher_variant': report.get('launcher_variant', 'upstream'),
                            'codec_search': report['codec_search']['name'],
                            'whole_bytes': report['whole']['bytes'],
                            'within_4096': report['qualification']['size_within_4096'],
                            'candidate_status': report['candidate_status']}, sort_keys=True))
          if not report['qualification']['size_within_4096']:
              raise SystemExit('Produced whole file exceeds the 4 KiB limit; candidate remains deferred.')
          PY
      - name: Preserve diagnostic receipt without upstream source or binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peer-exact-p192-${{ matrix.peer }}-${{ matrix.variant }}-${{ matrix.launcher }}-${{ matrix.codec }}-${{ github.sha }}
          path: ${{ runner.temp }}/peer-p192-result-${{ matrix.peer }}/peer-exact.json
          if-no-files-found: warn
          retention-days: 7
