  production-profiles-p28:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: A, spelling: compound, scan: square-successor, ep_variant: control}
          - {family: B, spelling: best, scan: control, ep_variant: control}
          - {family: C, spelling: compound, scan: square-successor, ep_variant: legal-maker}
          - {family: D, spelling: control, scan: control, ep_variant: control}
          - {family: E, spelling: compound, scan: control, ep_variant: legal-maker}
          - {family: F, spelling: compound-v2, scan: control, ep_variant: control}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ROVE_INCLUDE_ENTRY: ${{ matrix.family != 'D' || github.head_ref != 'feature/rove4k-engines-af' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned development-only oracle dependencies
        run: python -m pip install --require-hashes -r engines/training/e19/requirements.txt
      - name: Generate and verify the selected full TEST-P28 artifact
        if: env.ROVE_INCLUDE_ENTRY == 'true'
        run: >-
          python -I -B engines/scripts/production_ci.py
          --family '${{ matrix.family }}'
          --profile test-p28
          --spelling-variant '${{ matrix.spelling }}'
          --scan-variant '${{ matrix.scan }}'
          --ep-variant '${{ matrix.ep_variant }}'
          --export-source-bundle
          --out '${{ runner.temp }}/rove4k-production-${{ matrix.family }}-test-p28-${{ github.run_attempt }}'
      - name: Transfer the exact sealed P28 source to the Ubuntu22 consumer
        if: env.ROVE_INCLUDE_ENTRY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-source-${{ matrix.family }}-test-p28-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rove4k-production-${{ matrix.family }}-test-p28-${{ github.run_attempt }}/source-bundle.zip
            ${{ runner.temp }}/rove4k-production-${{ matrix.family }}-test-p28-${{ github.run_attempt }}/source-seal.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve owned P28 source-bound evidence and failures
        if: always() && env.ROVE_INCLUDE_ENTRY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-${{ matrix.family }}-test-p28-${{ github.sha }}
          path: ${{ runner.temp }}/rove4k-production-${{ matrix.family }}-test-p28-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 7

