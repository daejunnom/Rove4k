name: Rove4k engines

on:
  push:
    branches: [main, develop]
    paths: ['engines/**', '.github/workflows/engines.yml']
  pull_request:
    paths: ['engines/**', '.github/workflows/engines.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [c]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure external artifacts
        run: printf 'ROVE_TEST_OUT=%s/rove4k-engines-%s\n' "$RUNNER_TEMP" '${{ matrix.language }}' >> "$GITHUB_ENV"
      - name: Install the independent Rust compiler
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Check the frozen model source and exact integer representation
        run: |
          python3 engines/model/codec.py check
          python3 -m unittest discover -s engines/model -p 'test*.py'
          python3 -m unittest discover -s engines/model/representations -p 'test_*.py'
      - name: Check source compaction and real restoration lifetimes
        run: python3 -m unittest discover -s engines/scripts -p 'test*.py'
      - name: Check C scheduling contracts independently of engine integration
        if: matrix.language == 'c'
        run: |
          mkdir -p "$ROVE_TEST_OUT"
          cc -std=c11 -O1 -g -pthread -fsanitize=address,undefined engines/tests/parallel_contract.c -o "$ROVE_TEST_OUT/parallel-contract"
          timeout 60 "$ROVE_TEST_OUT/parallel-contract"
      - name: Check C SEE, singular exclusion, SIMD and MTD semantics
        if: matrix.language == 'c'
        run: python3 engines/tests/run_search_contract.py --out "$ROVE_TEST_OUT/search-contract" --variants BCF --workers 1
      - name: Check structural source admission and bounded worker representations
        if: matrix.language == 'c'
        run: |
          python3 -m unittest discover -s engines/compact/c -p 'test_*.py'
          python3 -B -m unittest discover -s engines/compact/tiny-b -p 'test_*.py'
          python3 -B -m unittest discover -s engines/compact/tiny-ce -p 'test_*.py'
          python3 -B -m unittest discover -s engines/compact/tiny-f -p 'test_*.py'
          python3 -B -m unittest discover -s engines/experiments/tiny-c-table -p 'test_*.py'
          python3 -B -m unittest discover -s engines/experiments/tiny-e-state -p 'test_*.py'
      - name: Check coherent full-key TT publication and directional replacement
        if: matrix.language == 'c'
        run: |
          for single in 0 1; do
            cc -std=c11 -O2 -pthread -DROVE_VARIANT=6 -DROVE_F_SINGLE="$single" -DROVE_TT_BITS=8 -DROVE_WORKERS=1 -DROVE_DEV=0 engines/experiments/f/tt_contract.c engines/c/board.c -o "$ROVE_TEST_OUT/tt-contract-$single"
            timeout 60 "$ROVE_TEST_OUT/tt-contract-$single"
          done
      - name: Check the smaller A source architecture and actual complete launcher
        if: matrix.language == 'c'
        run: |
          python3 -B -m unittest discover -s engines/compact/tiny-a -p 'test_*.py'
          python3 -I -B engines/compact/tiny-a/build.py --out "$ROVE_TEST_OUT/tiny-a" --board generated --single-unit --strip-dev-counters
          python3 engines/tests/verify.py --manifest "$ROVE_TEST_OUT/tiny-a/validation-manifest.json" --out "$ROVE_TEST_OUT/tiny-a-verification" --startup-threads 3
          cc -std=c11 -O2 -pthread -DWORKERS=2 -DTT_BITS=18 -DDEV=1 -DPLY=4 "$ROVE_TEST_OUT/tiny-a/dev/main.c" -o "$ROVE_TEST_OUT/tiny-a-cap"
          python3 engines/compact/tiny-a/check.py --engine "$ROVE_TEST_OUT/tiny-a/dev/x" --cap-engine "$ROVE_TEST_OUT/tiny-a-cap" --out "$ROVE_TEST_OUT/tiny-a-algorithms.json"
      - name: Check source-literal byte preservation
        if: matrix.language == 'c'
        run: python3 -B -m unittest discover -s engines/experiments/tiny-encoding -p 'test_*.py'
      - name: Regenerate maintained source entries and run each exact selected file
        if: matrix.language == 'c'
        run: |
          for family in a b c e f; do
            python3 -B "engines/compact/tiny-entry-$family/build.py" --out "$ROVE_TEST_OUT/tiny-entry-$family" --dev
            python3 -B "engines/compact/tiny-entry-$family/verify.py" --build "$ROVE_TEST_OUT/tiny-entry-$family" --out "$ROVE_TEST_OUT/tiny-entry-$family-runtime"
          done
          python3 -B engines/compact/tiny-entry-f/build.py --policy material-noise --out "$ROVE_TEST_OUT/tiny-entry-f-material-noise" --dev
          python3 -B "$ROVE_TEST_OUT/tiny-entry-f-material-noise/selected-verifier/engines/compact/tiny-entry-f/verify.py" --build "$ROVE_TEST_OUT/tiny-entry-f-material-noise" --out "$ROVE_TEST_OUT/tiny-entry-f-material-noise-runtime"
          python3 -B engines/compact/tiny-entry-f/build.py --policy material-move-tt --out "$ROVE_TEST_OUT/tiny-entry-f-material-move-tt" --dev
          python3 -B "$ROVE_TEST_OUT/tiny-entry-f-material-move-tt/selected-verifier/engines/compact/tiny-entry-f/verify.py" --build "$ROVE_TEST_OUT/tiny-entry-f-material-move-tt" --out "$ROVE_TEST_OUT/tiny-entry-f-material-move-tt-runtime"
          python3 -B -m unittest discover -s engines/experiments/tiny-e-order -p 'test_*.py'
      - name: Reproduce each full A B C E shell wrapper and check its selected shell contract
        if: matrix.language == 'c'
        run: |
          for family in a b c e; do
            python3 -B "engines/compact/tiny-entry-$family/build.py" --wrapper shell --out "$ROVE_TEST_OUT/tiny-entry-$family-shell"
            python3 -B "$ROVE_TEST_OUT/tiny-entry-$family-shell/selected-verifier/engines/scripts/verify_shell.py" --build "$ROVE_TEST_OUT/tiny-entry-$family-shell" --recipe "$ROVE_TEST_OUT/tiny-entry-$family-shell/selected-verifier/recipe.json" --out "$ROVE_TEST_OUT/tiny-entry-$family-shell-runtime"
          done
      - name: Reproduce the full TCEC submissions and verify their declared runtime policies
        if: matrix.language == 'c'
        run: |
          for entry in A B C E F F8; do
            python3 -B engines/experiments/tcec-scope/build.py --entry "$entry" --out "$ROVE_TEST_OUT/tcec-$entry"
            python3 -B engines/experiments/tcec-scope/verify.py --build "$ROVE_TEST_OUT/tcec-$entry" --out "$ROVE_TEST_OUT/tcec-$entry-runtime"
          done
      - name: Reproduce next full submissions with per-GO lifetime and entry-owned unlink
        if: matrix.language == 'c'
        run: |
          for entry in A B C E F F8; do
            python3 -B engines/experiments/tcec-next/build.py --entry "$entry" --out "$ROVE_TEST_OUT/tcec-next-$entry"
            python3 -B engines/experiments/tcec-scope/verify.py --build "$ROVE_TEST_OUT/tcec-next-$entry" --out "$ROVE_TEST_OUT/tcec-next-$entry-runtime"
          done
          python3 -B engines/experiments/tcec-next/check_b_state.py --source "$ROVE_TEST_OUT/tcec-next-B/control/main.c" --out "$ROVE_TEST_OUT/tcec-next-B-state"
      - name: Reproduce the full F kill wrapper and check its selected strict contract
        if: matrix.language == 'c'
        run: |
          python3 -B engines/compact/tiny-entry-f/build.py --out "$ROVE_TEST_OUT/tiny-entry-f-kill" --wrapper kill
          python3 -B "$ROVE_TEST_OUT/tiny-entry-f-kill/selected-verifier/engines/compact/tiny-entry-f/verify.py" --build "$ROVE_TEST_OUT/tiny-entry-f-kill" --out "$ROVE_TEST_OUT/tiny-entry-f-kill-runtime"
      - name: Reproduce the full F shell wrapper and check its selected shell contract
        if: matrix.language == 'c'
        run: |
          python3 -B engines/compact/tiny-entry-f/build.py --out "$ROVE_TEST_OUT/tiny-entry-f-shell" --wrapper shell
          python3 -B engines/scripts/verify_shell.py --build "$ROVE_TEST_OUT/tiny-entry-f-shell" --recipe "$ROVE_TEST_OUT/tiny-entry-f-shell/selected-verifier/engines/compact/tiny-entry-f/recipe.json" --out "$ROVE_TEST_OUT/tiny-entry-f-shell-runtime"
      - name: Reproduce the optional fixed-two-worker A root-hint policy
        if: matrix.language == 'c'
        run: |
          python3 -B engines/compact/tiny-entry-a/build.py --policy root-hint-leader-repair --out "$ROVE_TEST_OUT/tiny-entry-a-root-hint" --dev
          python3 -B engines/compact/tiny-entry-a/verify.py --policy root-hint-leader-repair --build "$ROVE_TEST_OUT/tiny-entry-a-root-hint" --out "$ROVE_TEST_OUT/tiny-entry-a-root-hint-runtime"
      - name: Reproduce the optional fixed-two-worker A NORMAL-slot policy
        if: matrix.language == 'c'
        run: |
          id -u
          python3 -B engines/compact/tiny-entry-a/build.py --policy root-normal-slots --out "$ROVE_TEST_OUT/tiny-entry-a-root-normal" --dev
          python3 -B engines/compact/tiny-entry-a/verify.py --policy root-normal-slots --build "$ROVE_TEST_OUT/tiny-entry-a-root-normal" --out "$ROVE_TEST_OUT/tiny-entry-a-root-normal-runtime"
      - name: Reproduce the optional fixed-two-worker A PALS feedback policy
        if: matrix.language == 'c'
        run: |
          python3 -B engines/compact/tiny-entry-a/build.py --policy root-pals-feedback --out "$ROVE_TEST_OUT/tiny-entry-a-root-pals" --dev
          python3 -B engines/compact/tiny-entry-a/verify.py --policy root-pals-feedback --build "$ROVE_TEST_OUT/tiny-entry-a-root-pals" --out "$ROVE_TEST_OUT/tiny-entry-a-root-pals-runtime"
      - name: Reproduce the fixed eight-worker F profile and check its positive lifetime
        if: matrix.language == 'c'
        run: |
          python3 -I -B engines/compact/tiny-entry-f-resource8/build.py --base-source "$ROVE_TEST_OUT/tiny-entry-f/main.c" --out "$ROVE_TEST_OUT/tiny-entry-f-resource8"
          python3 -I -B engines/compact/tiny-entry-f-resource8/verify.py --build "$ROVE_TEST_OUT/tiny-entry-f-resource8" --out "$ROVE_TEST_OUT/tiny-entry-f-resource8-runtime"
      - name: Reproduce the fixed eight-worker F shell profile and check its selected shell contract
        if: matrix.language == 'c'
        run: |
          python3 -I -B engines/compact/tiny-entry-f-resource8/build.py --base-source "$ROVE_TEST_OUT/tiny-entry-f/main.c" --wrapper shell --out "$ROVE_TEST_OUT/tiny-entry-f-resource8-shell"
          python3 -I -B "$ROVE_TEST_OUT/tiny-entry-f-resource8-shell/inputs/engines/scripts/verify_shell.py" --build "$ROVE_TEST_OUT/tiny-entry-f-resource8-shell/first" --recipe "$ROVE_TEST_OUT/tiny-entry-f-resource8-shell/selected-verifier/recipe.json" --out "$ROVE_TEST_OUT/tiny-entry-f-resource8-shell-runtime"
      - name: Check the semaphore pool through controlled real-runtime phases and faults
        if: matrix.language == 'c'
        run: python3 -B engines/experiments/tiny-semaphore/pool-check.py --frozen engines/experiments/tiny-semaphore --out "$ROVE_TEST_OUT/semaphore-pool"
      - name: Check dedicated D lossless codecs independently
        if: matrix.language == 'c'
        run: python3 -B -m unittest discover -s engines/experiments/tiny-d-loader -p 'test_codecs.py'
      - name: Regenerate both maintained D own-ELFs and observe their actual restored images
        if: matrix.language == 'c'
        run: |
          python3 -B engines/compact/tiny-entry-d/build.py --out "$ROVE_TEST_OUT/tiny-entry-d"
          python3 -B engines/compact/tiny-entry-d/verify.py --build "$ROVE_TEST_OUT/tiny-entry-d/build.json" --out "$ROVE_TEST_OUT/tiny-entry-d-runtime"
      - name: Check the standalone syscall D core and both actual slider paths
        if: matrix.language == 'c'
        run: |
          python3 -B engines/compact/tiny-d/build.py --out "$ROVE_TEST_OUT/tiny-d" --optimize z --lto
          python3 -B engines/compact/tiny-d/check.py --build "$ROVE_TEST_OUT/tiny-d/build.json" --out "$ROVE_TEST_OUT/tiny-d-check"
          python3 -B engines/compact/tiny-d/algorithms.py --build "$ROVE_TEST_OUT/tiny-d/build.json" --out "$ROVE_TEST_OUT/tiny-d-algorithms"
          python3 -B engines/compact/tiny-d/test_runtime.py --out "$ROVE_TEST_OUT/tiny-d-runtime"
      - name: Check independent Rust rule and search contracts
        if: matrix.language == 'rust'
        env:
          RUSTUP_TOOLCHAIN: 1.97.0
          ROVE_DEV: '1'
          ROVE_VARIANT: D
          ROVE_WORKERS: '2'
          ROVE_TT_BITS: '16'
        run: |
          mkdir -p "$ROVE_TEST_OUT"
          rustc --edition=2024 --test -O engines/rust/main.rs -o "$ROVE_TEST_OUT/rust-contracts"
          timeout 120 "$ROVE_TEST_OUT/rust-contracts"
      - name: Build independent no_std Rust D and check its real scalar and HQ paths
        if: matrix.language == 'rust'
        env:
          RUSTUP_TOOLCHAIN: 1.97.0
        run: |
          mkdir -p "$ROVE_TEST_OUT/tiny-rust-d"
          for lane in hq scalar; do
            python3 -I -B engines/compact/tiny-rust-d/build.py --out "$ROVE_TEST_OUT/tiny-rust-d/$lane" --hq "$lane" --workers 2 --tt-bits 18 --reproduce
          done
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['ROVE_TEST_OUT']) / 'tiny-rust-d'
          expected = {
              'hq': 'f8581a68f09d4d9cdc3e1413aa45ffb385bafd8240f1432403629ec2a0e544f8',
              'scalar': 'bd0e3bd1567ae906d4ab9704603204d22302895df1f05679f6221d6445aef878',
          }
          for lane, pin in expected.items():
              report = json.loads((root / lane / 'build.json').read_text())
              image = (root / lane / 'first/x').read_bytes()
              assert len(image) == report['complete_native_bytes'] == 16816
              assert hashlib.sha256(image).hexdigest() == report['complete_native_sha256'] == pin, lane
              assert report['reproduced'] and all(report['artifact_gates'].values())
              assert (report['workers'], report['tt_bits'], report['startup_threads'], report['hq']) == (2, 18, 3, lane)
          PY
          python3 -I -B engines/compact/tiny-rust-d/verify_runtime.py --hq "$ROVE_TEST_OUT/tiny-rust-d/hq/first/x" --scalar "$ROVE_TEST_OUT/tiny-rust-d/scalar/first/x" --out "$ROVE_TEST_OUT/tiny-rust-d/runtime"
          for lane in hq scalar; do
            python3 -I -B engines/compact/tiny-rust-d/tests/runtime_trace.py --image "$ROVE_TEST_OUT/tiny-rust-d/$lane/first/x" --out "$ROVE_TEST_OUT/tiny-rust-d/trace-$lane"
          done
          python3 -I -B engines/compact/tiny-rust-d/verify_board.py --out "$ROVE_TEST_OUT/tiny-rust-d/board"
          python3 -I -B engines/compact/tiny-rust-d/verify_search.py --unit-only --out "$ROVE_TEST_OUT/tiny-rust-d/search"
      - name: Reproduce finite Rust D shipping entries and check their positive lifetimes
        if: matrix.language == 'rust'
        env:
          RUSTUP_TOOLCHAIN: 1.97.0
        run: |
          mkdir -p "$ROVE_TEST_OUT/tiny-rust-d-shipping"
          python3 -I -B engines/compact/tiny-rust-d-shipping/test_queue.py --out "$ROVE_TEST_OUT/tiny-rust-d-shipping/queue-boundary"
          python3 -I -B engines/compact/tiny-rust-d-shipping/build.py --out "$ROVE_TEST_OUT/tiny-rust-d-shipping/build"
          python3 -I -B engines/compact/tiny-rust-d-shipping/verify.py --build "$ROVE_TEST_OUT/tiny-rust-d-shipping/build" --out "$ROVE_TEST_OUT/tiny-rust-d-shipping/runtime"
      - name: Compile the fixed A root source forms
        if: matrix.language == 'c'
        run: python3 -B engines/scripts/build.py --out "$ROVE_TEST_OUT/fixed-root" --profile local-ship --languages c --variant A --parallel root --structural-compact --no-pack
      - name: Build retained C A-F paths
        run: |
          variants=ABCDEF
          python3 engines/scripts/build.py --out "$ROVE_TEST_OUT/build" --profile local-dev --languages '${{ matrix.language }}' --variants "$variants" --no-pack
      - name: Verify the engines through their actual process interfaces
        run: python3 engines/tests/verify.py --manifest "$ROVE_TEST_OUT/build/build.json" --out "$ROVE_TEST_OUT/verification"
      - name: Preserve bounded build and behavior evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rove4k-${{ matrix.language }}-${{ github.sha }}
          path: |
            ${{ env.ROVE_TEST_OUT }}/build/build.json
            ${{ env.ROVE_TEST_OUT }}/verification/*.json
            ${{ env.ROVE_TEST_OUT }}/verification/*.jsonl
            ${{ env.ROVE_TEST_OUT }}/search-contract/results.json
            ${{ env.ROVE_TEST_OUT }}/tiny-a/build.json
            ${{ env.ROVE_TEST_OUT }}/tiny-a/validation-manifest.json
            ${{ env.ROVE_TEST_OUT }}/tiny-a-verification/*.json
            ${{ env.ROVE_TEST_OUT }}/tiny-a-verification/*.jsonl
            ${{ env.ROVE_TEST_OUT }}/tiny-a-algorithms.json
            ${{ env.ROVE_TEST_OUT }}/tiny-entry-*/build.json
            ${{ env.ROVE_TEST_OUT }}/tiny-entry-*-runtime/**/*.json
            ${{ env.ROVE_TEST_OUT }}/tiny-entry-f-kill/selected-verifier/engines/compact/tiny-entry-f/recipe.json
            ${{ env.ROVE_TEST_OUT }}/tiny-entry-*-shell/selected-verifier/recipe.json
            ${{ env.ROVE_TEST_OUT }}/tiny-entry-f-shell/selected-verifier/engines/compact/tiny-entry-f/recipe.json
            ${{ env.ROVE_TEST_OUT }}/tiny-entry-f-resource8-shell/source-proof.json
            ${{ env.ROVE_TEST_OUT }}/tiny-entry-f-resource8-shell/selected-verifier/recipe.json
            ${{ env.ROVE_TEST_OUT }}/tcec-*/build.json
            ${{ env.ROVE_TEST_OUT }}/tcec-*/source-proof.json
            ${{ env.ROVE_TEST_OUT }}/tcec-*-runtime/**/*.json
            ${{ env.ROVE_TEST_OUT }}/tcec-next-B-state/result.json
            ${{ env.ROVE_TEST_OUT }}/tiny-d/build.json
            ${{ env.ROVE_TEST_OUT }}/tiny-d-check/**/*.json
            ${{ env.ROVE_TEST_OUT }}/tiny-d-check/**/*.jsonl
            ${{ env.ROVE_TEST_OUT }}/tiny-d-algorithms/**/*.json
            ${{ env.ROVE_TEST_OUT }}/tiny-d-runtime/results.json
            ${{ env.ROVE_TEST_OUT }}/fixed-root/build.json
            ${{ env.ROVE_TEST_OUT }}/tiny-rust-d/**/*.json
            ${{ env.ROVE_TEST_OUT }}/tiny-rust-d-shipping/**/*.json
            ${{ env.ROVE_TEST_OUT }}/semaphore-pool/**/*.json
          if-no-files-found: ignore
          retention-days: 7
